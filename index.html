<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار الطاقة الشمسية - المهندس مراد الأثوري</title>
    <style>
        :root { --primary: #27ae60; --secondary: #2c3e50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--secondary); color: white; padding: 30px; text-align: center; }
        .tabs { display: flex; background: #eee; }
        .tab-btn { flex: 1; padding: 15px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 16px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .content { padding: 30px; display: none; }
        .content.active { display: block; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-calc { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .result-card { margin-top: 25px; padding: 20px; border-right: 5px solid var(--primary); background: #f9fffb; border-radius: 10px; }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #eee; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>المركز الهندسي للطاقة الشمسية ⚡</h1>
        <p>حلول ذكية ودقيقة تحت إشراف هندسي</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('tech')">حساب المكونات الفنية</button>
        <button class="tab-btn" onclick="openTab('finance')">حساب الجدوى المالية</button>
    </div>

    <div id="tech" class="content active">
        <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="input-group"><label>الأحمال (واط):</label><input type="number" id="load" placeholder="مثلاً: 2000"></div>
            <div class="input-group"><label>نوع البطارية:</label>
                <select id="battery"><option value="li">ليثيوم</option><option value="gel">جل / أسيد</option></select>
            </div>
        </div>
        <button class="btn-calc" onclick="calcTechnical()">توليد المخطط الفني</button>
        <div id="resTech" class="result-card" style="display:none"></div>
    </div>

    <div id="finance" class="content">
        <div class="input-group"><label>الفاتورة الشهرية ($):</label><input type="number" id="bill" placeholder="مثلاً: 100"></div>
        <div class="input-group"><label>سعر المنظومة ($):</label><input type="number" id="price" placeholder="مثلاً: 3500"></div>
        <button class="btn-calc" onclick="calcFinancial()">حساب فترة الاسترداد</button>
        <div id="resFin" class="result-card" style="display:none"></div>
    </div>

    <div class="footer">
        <img src="mur.png" alt="المهندس مراد الأثوري" class="profile-img">
        <h3 style="margin: 10px 0;">المهندس مراد الأثوري</h3>
        <p style="color: var(--primary); font-weight: bold; font-size: 1.2em;">📞 775066061</p>
        <p style="font-size: 14px; color: #7f8c8d;">خبير أنظمة الطاقة الشمسية ومطور ووردبريس</p>
    </div>
</div>

<script>
    function openTab(tabName) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function calcTechnical() {
        let load = document.getElementById('load').value;
        if(!load) return;
        let panels = Math.ceil(load / 300);
        let inverter = Math.ceil(load * 1.3);
        let res = document.getElementById('resTech');
        res.style.display = 'block';
        res.innerHTML = `<b>المواصفات المقترحة:</b><br>• الألواح: ${panels} ألواح (550 واط)<br>• الإنفرتر: ${inverter} واط<br>• القاطع: ${Math.ceil(inverter/24)} أمبير<br>• الأسلاك: DC 6mm / AC 4mm`;
    }

    function calcFinancial() {
        let bill = document.getElementById('bill').value;
        let price = document.getElementById('price').value;
        if(!bill || !price) return;
        let payback = (price / (bill * 12)).toFixed(1);
        let res = document.getElementById('resFin');
        res.style.display = 'block';
        res.innerHTML = `<b>الجدوى المالية:</b><br>• توفيرك السنوي: ${bill * 12} $<br>• استرداد التكلفة خلال: ${payback} سنة<br>• الربح الصافي (20 سنة): ${(bill*12*20 - price).toLocaleString()} $`;
    }
</script>
</body>
  </html>
